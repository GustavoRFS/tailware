name: Android CI

on:
  push:
    branches:
      - main
      - "release-branch/*"
    tags:
      - "v*"
  pull_request:
    # Re-run policy checks when a draft becomes reviewable or its base changes.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: "go.mod"
      - name: Switch to Java 17 # Note: 17 is pre-installed on ubuntu-latest
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: "temurin"
          java-version: "17"

      # Clean should essentially be a no-op, but make sure that it works.
      - name: Clean
        run: make clean

      - name: Format check (ktfmt)
        run: make fmt-check

      - name: Android lint
        run: make lint

      - name: Validate Tailware locales
        run: python3 tools/validate-tailware-locales.py --run-fixtures

      - name: Validate Wear VPN bootstrap helpers
        run: python3 tools/validate-wear-vpn-bootstrap.py --mode development --run-fixtures

      - name: Reject private guide URLs in release branches
        if: >-
          (github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/heads/release-branch/') ||
          startsWith(github.ref, 'refs/tags/'))) ||
          (github.event_name == 'pull_request' &&
          github.event.pull_request.draft == false &&
          (github.base_ref == 'main' ||
          startsWith(github.base_ref, 'release-branch/')))
        run: python3 tools/validate-wear-vpn-bootstrap.py --mode release
  
      - name: Run Go tests
        run: make go-test

      - name: Build APKs
        run: make tailware-debug.apk

      - name: Run tests
        run: make test
